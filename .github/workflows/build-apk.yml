name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download databases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/databases

          gh release download 1.0.0 \
            --repo "${{ github.repository }}" \
            --pattern "*.db" \
            --dir assets/databases

      - name: Verify databases
        run: |
          required=(
            "alanbar.db"
            "babylon.db"
            "baghdad.db"
            "basrah.db"
            "dhiqar.db"
            "diyala.db"
            "duhok.db"
            "erbil.db"
            "karbalaa.db"
            "kirkuk.db"
            "mesan.db"
            "muthana.db"
            "najaf.db"
            "nineveh.db"
            "qadisiyah.db"
            "salahaldeen.db"
            "sulaymaniyah.db"
            "wasit.db"
          )

          for file in "${required[@]}"; do
            if [ ! -f "assets/databases/$file" ]; then
              echo "ERROR: Missing database: $file"
              exit 1
            fi
          done

          echo "All 18 province databases are present."

      - name: Build Flet APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: iraq-data-app-apk
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
          overwrite: true
