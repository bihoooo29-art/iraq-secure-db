name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  BUILD_NUMBER: 1
  BUILD_VERSION: 1.0.0
  PYTHON_VERSION: 3.12.2
  RELEASE_TAG: v1.0.0

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Bundled Databases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Creating database assets folder..."
          mkdir -p assets/databases

          echo "Downloading all SQLite databases from Release $RELEASE_TAG..."

          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.db" \
            --dir assets/databases \
            --clobber

          echo ""
          echo "Downloaded databases:"
          ls -lh assets/databases

          echo ""
          echo "Database count:"
          find assets/databases -maxdepth 1 -type f -name "*.db" | wc -l

          echo ""
          echo "Total database size:"
          du -sh assets/databases

      - name: Build APK with Flet
        run: |
          flet build apk \
            --yes \
            --verbose \
            --build-number="$BUILD_NUMBER" \
            --build-version="$BUILD_VERSION"

      - name: Show APK Size
        run: |
          echo "Generated APK files:"
          ls -lh build/apk/*.apk

          echo ""
          echo "APK size:"
          du -h build/apk/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iraq-db-app-apk
          path: build/apk/*.apk
          if-no-files-found: error
          overwrite: true
