name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.14"

      - name: Create Python environment
        run: |
          uv venv --python 3.14 .venv

      - name: Install Flet
        run: |
          uv pip install --python .venv/bin/python "flet[all]"

      - name: Build APK
        run: |
          .venv/bin/flet build apk \
            --python-version 3.14 \
            --build-number ${{ github.run_number }} \
            --yes

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: iraq-data-app-apk
          path: build/apk/*.apk
          if-no-files-found: error
          overwrite: true
