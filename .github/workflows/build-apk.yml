name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  BUILD_NUMBER: 1
  BUILD_VERSION: 1.0.0
  PYTHON_VERSION: 3.12.2
  RELEASE_TAG: v1.0.0

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare App Assets
        run: |
          set -e

          echo "Preparing Flet assets..."

          mkdir -p assets/databases

          echo "Copying background..."
          cp bg.jpg assets/bg.jpg

          echo "Copying app icon..."
          cp icon.png assets/icon.png

          echo ""
          echo "Assets:"
          ls -lh assets/

      - name: Prepare Bundled Databases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Downloading available SQLite databases from Release $RELEASE_TAG..."

          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.db" \
            --dir assets/databases \
            --clobber

          echo ""
          echo "Downloaded databases:"
          ls -lh assets/databases

          echo ""
          echo "Database count:"
          DB_COUNT=$(find assets/databases -maxdepth 1 -type f -name "*.db" | wc -l)
          echo "$DB_COUNT"

          echo ""
          echo "Total database size:"
          du -sh assets/databases

      - name: Verify Assets Before Build
        run: |
          set -e

          echo "Checking required files..."

          test -f assets/bg.jpg
          test -f assets/icon.png

          DB_COUNT=$(find assets/databases -maxdepth 1 -type f -name "*.db" | wc -l)

          echo "Database count = $DB_COUNT"

          if [ "$DB_COUNT" -eq 0 ]; then
            echo "ERROR: No database files were found."
            exit 1
          fi

          echo ""
          echo "Available databases:"
          find assets/databases -maxdepth 1 -type f -name "*.db" -printf "%f\n" | sort

          echo ""
          echo "Missing database files will be skipped."
          echo "Assets are ready for the APK build."

          echo ""
          echo "Total assets size:"
          du -sh assets

      - name: Build APK with Flet
        run: |
          flet build apk \
            --yes \
            --verbose \
            --build-number="$BUILD_NUMBER" \
            --build-version="$BUILD_VERSION"

      - name: Show APK Size
        run: |
          echo "Generated APK files:"
          ls -lh build/apk/*.apk

          echo ""
          echo "APK size:"
          du -h build/apk/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iraq-db-app-apk
          path: build/apk/*.apk
          if-no-files-found: error
          overwrite: true
